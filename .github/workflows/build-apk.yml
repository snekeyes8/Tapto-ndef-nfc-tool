name: Build NDEF Emulator APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      # Changed from 'assemblePhoneRelease' to 'assemblePhoneDebug'
      - name: Build Phone and Watch APKs
        run: |
          ./gradlew clean assemblePhoneDebug assembleWatchDebug
          
      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: demo/phone/build/outputs/apk/phone/debug/*.apk

      - name: Upload Watch APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-debug-apk
          path: demo/watch/build/outputs/apk/watch/debug/*.apk
